name: deploy-daily

on:
  schedule:
    - cron: '7/10 * * * *'
  workflow_dispatch: 

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          PUBLIC_CLUB_LOGOS_FOLDER_ID: ${{ secrets.PUBLIC_CLUB_LOGOS_FOLDER_ID }}
          PUBLIC_EVENTS_SPREADSHEET_ID: ${{ secrets.PUBLIC_EVENTS_SPREADSHEET_ID }}
          PUBLIC_GALLERY_FOLDER_ID: ${{ secrets.PUBLIC_GALLERY_FOLDER_ID }}
          PUBLIC_MEMBERS_FOLDER_ID: ${{ secrets.PUBLIC_MEMBERS_FOLDER_ID }}
          PUBLIC_SPREADSHEET_ID: ${{ secrets.PUBLIC_SPREADSHEET_ID }}
          SECRET_GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.SECRET_GOOGLE_DRIVE_CREDENTIALS }}
          SECRET_GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.SECRET_GOOGLE_SHEETS_CREDENTIALS }}

      - name: Deploy to GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          npm run deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}